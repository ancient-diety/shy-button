<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Tiny Garden · Sunset Arcade</title><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="../arcade.css"></head><body><main class="game-page"><a class="back-link" href="../index.html">← BACK TO THE ARCADE</a><div class="pixel-sun">✿</div><h1>A Tiny Garden</h1><p class="game-description">A little plant is looking thirsty. Give it a drink!</p><div class="garden-scene"><div class="plant" id="plant">♧</div><div class="garden-ground"></div></div><button class="water-button" id="water-button" type="button">💧 Water the plant</button><p id="garden-message" aria-live="polite">The little plant is ready for a drink.</p></main><script>const plant=document.querySelector("#plant"),button=document.querySelector("#water-button"),message=document.querySelector("#garden-message");const stages=["♧","♣","♣","♣","✿"],notes=["A tiny sip! It perks up a little.","Another splash! A new leaf appeared!","Look at those leaves! Keep going!","One more drink...","All grown up! You made it bloom! 🌼"];let drinks=0;button.addEventListener("click",()=>{if(drinks>=stages.length){drinks=0;button.textContent="💧 Water the plant";message.textContent="A new little seed is ready to grow.";plant.textContent="♧";plant.classList.remove("growing");return}plant.textContent=stages[drinks];plant.classList.add("growing");message.textContent=notes[drinks];drinks++;if(drinks===stages.length)button.textContent="🌱 Grow another?";window.setTimeout(()=>plant.classList.remove("growing"),300)});</script></body></html>
