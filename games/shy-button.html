
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Catch the Shy Button · Sunset Arcade</title>

    <link
        rel="icon"
        href="../Pixel%20Star%20Gamer%20Icon.png"
        type="image/png"
    >

    <link rel="stylesheet" href="../arcade.css">
</head>

<body>

    <main class="game-page">

        <a class="back-link" href="../index.html">
            ← BACK TO THE ARCADE
        </a>

        <div class="pixel-sun" aria-hidden="true">✦</div>

        <h1>The Shy Button</h1>

        <p class="game-description">
            It wants to say hi... but gets a little nervous. Catch it after five hops!
        </p>

        <div id="play-area">
            <button id="shy-button" type="button">
                Say hi!
            </button>
        </div>

        <p id="message" aria-live="polite">
            Can you catch it?
        </p>

    </main>

    <script>
        const button = document.querySelector("#shy-button");
        const area = document.querySelector("#play-area");
        const message = document.querySelector("#message");

        let escapes = 0;
        let escapedOnPointerDown = false;

        function keepInBounds() {
            const halfWidth = button.offsetWidth / 2;
            const halfHeight = button.offsetHeight / 2;
            button.style.left = Math.max(halfWidth, Math.min(area.clientWidth - halfWidth, button.offsetLeft)) + "px";
            button.style.top = Math.max(halfHeight, Math.min(area.clientHeight - halfHeight, button.offsetTop)) + "px";
        }

        function scootAway() {
            if (escapes >= 5) return;

            const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
            const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

            button.style.left =
                (Math.random() * maxX + button.offsetWidth / 2) + "px";

            button.style.top =
                (Math.random() * maxY + button.offsetHeight / 2) + "px";

            escapes++;

            message.textContent = escapes === 5
                ? "Okay, okay... you can catch me now!"
                : "Eep! Almost!";
        }

        button.addEventListener("pointerenter", event => {
            if (event.pointerType === "mouse") {
                scootAway();
            }
        });

        button.addEventListener("pointerdown", event => {
            escapedOnPointerDown = event.pointerType !== "mouse" && escapes < 5;
            if (escapedOnPointerDown) {
                event.preventDefault();
                scootAway();
            }
        });

        button.addEventListener("click", event => {
            // Keyboard activation has no pointerdown; give it the same five hops.
            if (event.detail === 0 && escapes < 5) {
                scootAway();
                return;
            }
            if (escapes < 5 || (event.detail !== 0 && escapedOnPointerDown)) return;
            message.textContent = "Hi, friend! Thanks for finding me ✨";
            button.textContent = "Hi, friend!";
            keepInBounds();
        });
        window.addEventListener("resize", keepInBounds);
    </script>

</body>

</html>
